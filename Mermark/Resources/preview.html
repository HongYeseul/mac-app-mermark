<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="github-dark.min.css" media="(prefers-color-scheme: dark)">
<style>
  :root { color-scheme: light dark; }
  body {
    font: 15px/1.65 -apple-system, "Apple SD Gothic Neo", sans-serif;
    max-width: 760px;
    margin: 0 auto;
    padding: 24px;
  }
  h1, h2, h3 { line-height: 1.3; }
  pre {
    overflow-x: auto;
    border-radius: 8px;
    padding: 12px;
    background: rgba(127, 127, 127, 0.1);
  }
  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.9em; }
  pre.mermaid { background: transparent; text-align: center; }
  .mermaid-block { position: relative; }
  .mermaid-toolbar {
    position: absolute;
    top: 4px;
    right: 4px;
    display: none;
    gap: 4px;
  }
  .mermaid-block:hover .mermaid-toolbar { display: flex; }
  .mermaid-toolbar button {
    font: 12px -apple-system, "Apple SD Gothic Neo", sans-serif;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid rgba(127, 127, 127, 0.4);
    background: Canvas;
    color: CanvasText;
    cursor: pointer;
  }
  .mermaid-toolbar button:hover { background: rgba(127, 127, 127, 0.15); }
  table { border-collapse: collapse; }
  th, td { border: 1px solid rgba(127, 127, 127, 0.35); padding: 4px 10px; }
  blockquote { margin: 0; padding-left: 1em; border-left: 3px solid rgba(127, 127, 127, 0.4); opacity: 0.85; }
  img { max-width: 100%; }
</style>
<script src="markdown-it.min.js"></script>
<script src="highlight.min.js"></script>
<script src="mermaid.min.js"></script>
</head>
<body>
<article id="content"></article>
<script>
  const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  mermaid.initialize({ startOnLoad: false, theme: isDark ? "dark" : "default" });

  const md = window.markdownit({
    html: false,
    linkify: true,
    highlight: (code, lang) => {
      if (lang && hljs.getLanguage(lang)) {
        try { return hljs.highlight(code, { language: lang }).value; } catch (e) {}
      }
      return "";
    },
  });

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // 최상위 블록마다 원본 줄 번호를 심는다 (에디터 ↔ 프리뷰 스크롤 동기화의 앵커)
  md.core.ruler.push("mermark_line_numbers", (state) => {
    for (const token of state.tokens) {
      if (token.map && token.level === 0) {
        token.attrSet("data-line", String(token.map[0]));
      }
    }
  });

  // ```mermaid 펜스는 하이라이트 대신 mermaid 렌더 대상으로 치환.
  // 내보내기용 원본 코드는 data-code(URI 인코딩)로 보존한다 — mermaid.run이 내용을 SVG로 바꾸기 때문.
  const defaultFence = md.renderer.rules.fence;
  md.renderer.rules.fence = (tokens, idx, options, env, self) => {
    const token = tokens[idx];
    const line = token.attrGet("data-line") || "0";
    if (token.info.trim() === "mermaid") {
      return (
        '<div class="mermaid-block" data-line="' + line + '" data-code="' + encodeURIComponent(token.content) + '">' +
        '<div class="mermaid-toolbar">' +
        '<button onclick="exportMermaid(this, \'copyPNG\')">PNG 복사</button>' +
        '<button onclick="exportMermaid(this, \'savePNG\')">PNG 저장</button>' +
        '<button onclick="exportMermaid(this, \'saveSVG\')">SVG 저장</button>' +
        "</div>" +
        '<pre class="mermaid">' + escapeHtml(token.content) + "</pre>" +
        "</div>"
      );
    }
    // 기본 렌더러는 data-line을 <code>에 붙인다. 앵커가 중복되지 않도록 떼어내고 <pre>를 직접 감싼다.
    const attrIndex = token.attrIndex("data-line");
    if (attrIndex >= 0) token.attrs.splice(attrIndex, 1);
    return '<div data-line="' + line + '">' + defaultFence(tokens, idx, options, env, self) + "</div>";
  };

  window.exportMermaid = (button, action) => {
    const block = button.closest(".mermaid-block");
    const code = decodeURIComponent(block.dataset.code);
    window.webkit?.messageHandlers?.mermaidExport?.postMessage({ action, code });
  };

  window.renderMarkdown = async (markdown) => {
    document.getElementById("content").innerHTML = md.render(markdown);
    lastReportedLine = -1;
    try {
      await mermaid.run({ nodes: document.querySelectorAll("pre.mermaid") });
    } catch (e) {
      // 문법 오류 시 mermaid가 해당 블록에 에러를 표시하므로 그대로 둔다
    }
  };

  // ── 에디터 ↔ 프리뷰 스크롤 동기화 ──────────────────────────────
  let suppressScrollReport = false;
  let suppressTimer = null;
  let lastReportedLine = -1;

  const anchors = () => [...document.querySelectorAll("[data-line]")];
  const lineOf = (el) => +el.dataset.line;

  /// value 이하인 마지막 앵커와 그 다음 앵커를 찾는다. 둘 사이는 비례 보간해서 쓴다.
  function bracket(list, valueOf, value) {
    let base = list[0];
    let next = null;
    for (const el of list) {
      if (valueOf(el) <= value) {
        base = el;
        next = null;
      } else {
        next = el;
        break;
      }
    }
    const span = next ? valueOf(next) - valueOf(base) : 0;
    const ratio = span > 0 ? Math.min(1, Math.max(0, (value - valueOf(base)) / span)) : 0;
    return { base, next: next || base, ratio };
  }

  window.scrollPreviewToLine = (line) => {
    const list = anchors();
    if (!list.length) return;
    const { base, next, ratio } = bracket(list, lineOf, line);
    suppressScrollReport = true;
    clearTimeout(suppressTimer);
    suppressTimer = setTimeout(() => { suppressScrollReport = false; }, 250);
    window.scrollTo(0, base.offsetTop + (next.offsetTop - base.offsetTop) * ratio);
  };

  window.currentPreviewLine = () => {
    const list = anchors();
    if (!list.length) return 0;
    const { base, next, ratio } = bracket(list, (el) => el.offsetTop, window.scrollY);
    return Math.round(lineOf(base) + (lineOf(next) - lineOf(base)) * ratio);
  };

  window.addEventListener("scroll", () => {
    if (suppressScrollReport) return;
    const line = window.currentPreviewLine();
    if (line === lastReportedLine) return;
    lastReportedLine = line;
    window.webkit?.messageHandlers?.previewScroll?.postMessage(line);
  });
</script>
</body>
</html>
