<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="github-dark.min.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="katex.min.css">
<style>
  :root { color-scheme: light dark; }
  body {
    font: 15px/1.65 -apple-system, "Apple SD Gothic Neo", sans-serif;
    max-width: 760px;
    margin: 0 auto;
    padding: 24px;
  }
  h1, h2, h3 { line-height: 1.3; }
  pre {
    overflow-x: auto;
    border-radius: 8px;
    padding: 12px;
    background: rgba(127, 127, 127, 0.1);
  }
  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.9em; }
  pre.mermaid { background: transparent; text-align: center; }
  .mermaid-block { position: relative; }
  .mermaid-toolbar {
    position: absolute;
    top: 4px;
    right: 4px;
    display: none;
    gap: 4px;
  }
  .mermaid-block:hover .mermaid-toolbar { display: flex; }
  .mermaid-toolbar button {
    font: 12px -apple-system, "Apple SD Gothic Neo", sans-serif;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid rgba(127, 127, 127, 0.4);
    background: Canvas;
    color: CanvasText;
    cursor: pointer;
  }
  .mermaid-toolbar button:hover { background: rgba(127, 127, 127, 0.15); }
  table { border-collapse: collapse; }
  th, td { border: 1px solid rgba(127, 127, 127, 0.35); padding: 4px 10px; }
  blockquote { margin: 0; padding-left: 1em; border-left: 3px solid rgba(127, 127, 127, 0.4); opacity: 0.85; }
  img { max-width: 100%; }
  .frontmatter {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 4px 16px;
    margin-bottom: 24px;
    padding: 12px 16px;
    border-radius: 8px;
    background: rgba(127, 127, 127, 0.08);
    border: 1px solid rgba(127, 127, 127, 0.2);
    font-size: 0.9em;
  }
  .frontmatter .fm-key { font-weight: 600; opacity: 0.7; }
  .frontmatter .fm-value { white-space: pre-wrap; }
  li.task-item { list-style: none; margin-left: -1.4em; }
  li.task-item input[type="checkbox"] { margin-right: 6px; vertical-align: middle; }
  li.task-item.done { color: rgba(127, 127, 127, 0.85); text-decoration: line-through; }
  /* 메인 색상(민트). Brand.swift와 같은 값을 쓴다 — 한쪽만 고치면 어긋난다 */
  .tag {
    display: inline-block;
    padding: 0 8px;
    border-radius: 10px;
    background: rgba(69, 199, 182, 0.16);
    color: #17786b;
    font-size: 0.88em;
    line-height: 1.5;
    cursor: pointer;
    white-space: nowrap;
  }
  .tag:hover { background: rgba(69, 199, 182, 0.3); }
  @media (prefers-color-scheme: dark) {
    .tag { background: rgba(126, 220, 204, 0.22); color: #7edccc; }
    .tag:hover { background: rgba(126, 220, 204, 0.34); }
  }
</style>
<script src="markdown-it.min.js"></script>
<script src="highlight.min.js"></script>
<script src="mermaid.min.js"></script>
<script src="katex.min.js"></script>
<script src="texmath.js"></script>
</head>
<body>
<article id="content"></article>
<script>
  const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  mermaid.initialize({ startOnLoad: false, theme: isDark ? "dark" : "default" });

  const md = window.markdownit({
    html: false,
    linkify: true,
    highlight: (code, lang) => {
      if (lang && hljs.getLanguage(lang)) {
        try { return hljs.highlight(code, { language: lang }).value; } catch (e) {}
      }
      return "";
    },
  });

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // 문서 맨 앞의 --- 블록(프론트매터). 규칙 없이 두면 "---"가 수평선과 setext 제목으로
  // 잘못 해석된다. 블록 토큰으로 잡아야 token.map이 남아 스크롤 동기화도 어긋나지 않는다.
  md.block.ruler.before("hr", "mermark_frontmatter", (state, startLine, endLine, silent) => {
    if (startLine !== 0) return false;
    const lineText = (n) => state.src.slice(state.bMarks[n] + state.tShift[n], state.eMarks[n]).trim();
    if (lineText(startLine) !== "---") return false;

    let closing = -1;
    for (let line = startLine + 1; line < endLine; line++) {
      if (lineText(line) === "---") { closing = line; break; }
    }
    if (closing < 0) return false;
    if (silent) return true;

    const token = state.push("frontmatter", "", 0);
    token.content = state.getLines(startLine + 1, closing, 0, false);
    token.map = [startLine, closing + 1];
    state.line = closing + 1;
    return true;
  });

  /// 표시용 최소 파서. 중첩 구조 대신 "키: 값"과 "- 항목" 목록만 다룬다.
  function parseFrontmatter(text) {
    const entries = [];
    for (const raw of text.split("\n")) {
      const line = raw.trim();
      if (!line || line.startsWith("#")) continue;
      const listItem = line.match(/^-\s+(.*)$/);
      if (listItem && entries.length) {
        const last = entries[entries.length - 1];
        last[1] = last[1] ? last[1] + ", " + listItem[1] : listItem[1];
        continue;
      }
      const pair = line.match(/^([^:]+):\s*(.*)$/);
      if (pair) entries.push([pair[1].trim(), pair[2].trim()]);
    }
    return entries;
  }

  md.renderer.rules.frontmatter = (tokens, idx) => {
    const entries = parseFrontmatter(tokens[idx].content);
    if (!entries.length) return "";
    const rows = entries
      .map(([key, value]) =>
        '<div class="fm-key">' + escapeHtml(key) + "</div>" +
        '<div class="fm-value">' + escapeHtml(value) + "</div>")
      .join("");
    return '<div class="frontmatter" data-line="' + tokens[idx].map[0] + '">' + rows + "</div>";
  };

  // 수식은 markdown-it 인라인 파싱보다 먼저 토큰으로 잡아야 "$x_1 + y_2$"의 밑줄이
  // 기울임으로 바뀌지 않는다. texmath가 그 역할을 한다.
  md.use(texmath, {
    engine: katex,
    delimiters: "dollars",
    katexOptions: { throwOnError: false, errorColor: "#d00" },
  });

  // 헤딩에 id를 붙여 "[링크](#섹션-이름)" 앵커가 동작하게 한다. GitHub과 같은 규칙.
  function slugify(text) {
    return text.trim().toLowerCase()
      .replace(/[^\p{L}\p{N}\s_-]/gu, "")
      .replace(/\s+/g, "-");
  }

  md.core.ruler.push("mermark_heading_anchors", (state) => {
    const used = new Map();
    state.tokens.forEach((token, index) => {
      if (token.type !== "heading_open") return;
      const inline = state.tokens[index + 1];
      if (!inline || inline.type !== "inline") return;
      let slug = slugify(inline.content) || "section";
      const seen = used.get(slug) || 0;
      used.set(slug, seen + 1);
      if (seen > 0) slug = slug + "-" + seen;
      token.attrSet("id", slug);
    });
  });

  // 목록 항목마다 원본 줄 번호를 남긴다. 체크박스를 눌렀을 때 어느 줄을 고칠지 알아야 한다.
  // 스크롤 앵커(data-line)와 섞이면 앵커가 중복되므로 이름을 따로 쓴다.
  md.core.ruler.push("mermark_task_lines", (state) => {
    for (const token of state.tokens) {
      if (token.type === "list_item_open" && token.map) {
        token.attrSet("data-task-line", String(token.map[0]));
      }
    }
  });

  // 최상위 블록마다 원본 줄 번호를 심는다 (에디터 ↔ 프리뷰 스크롤 동기화의 앵커)
  md.core.ruler.push("mermark_line_numbers", (state) => {
    for (const token of state.tokens) {
      if (token.map && token.level === 0) {
        token.attrSet("data-line", String(token.map[0]));
      }
    }
  });

  // ```mermaid 펜스는 하이라이트 대신 mermaid 렌더 대상으로 치환.
  // 내보내기용 원본 코드는 data-code(URI 인코딩)로 보존한다 — mermaid.run이 내용을 SVG로 바꾸기 때문.
  const defaultFence = md.renderer.rules.fence;
  md.renderer.rules.fence = (tokens, idx, options, env, self) => {
    const token = tokens[idx];
    const line = token.attrGet("data-line") || "0";
    if (token.info.trim() === "mermaid") {
      return (
        '<div class="mermaid-block" data-line="' + line + '" data-code="' + encodeURIComponent(token.content) + '">' +
        '<div class="mermaid-toolbar">' +
        '<button onclick="exportMermaid(this, \'copyPNG\')">PNG 복사</button>' +
        '<button onclick="exportMermaid(this, \'savePNG\')">PNG 저장</button>' +
        '<button onclick="exportMermaid(this, \'saveSVG\')">SVG 저장</button>' +
        "</div>" +
        '<pre class="mermaid">' + escapeHtml(token.content) + "</pre>" +
        "</div>"
      );
    }
    // 기본 렌더러는 data-line을 <code>에 붙인다. 앵커가 중복되지 않도록 떼어내고 <pre>를 직접 감싼다.
    const attrIndex = token.attrIndex("data-line");
    if (attrIndex >= 0) token.attrs.splice(attrIndex, 1);
    return '<div data-line="' + line + '">' + defaultFence(tokens, idx, options, env, self) + "</div>";
  };

  window.exportMermaid = (button, action) => {
    const block = button.closest(".mermaid-block");
    const code = decodeURIComponent(block.dataset.code);
    window.webkit?.messageHandlers?.mermaidExport?.postMessage({ action, code });
  };

  // 노트 기준 상대경로 이미지는 앱이 서빙하는 전용 스킴으로 바꾼다.
  // "/"로 시작하면 노트 폴더 최상위 기준, 아니면 노트가 든 폴더 기준.
  function resolveLocalImages() {
    for (const img of document.querySelectorAll("#content img")) {
      const src = img.getAttribute("src");
      if (!src) continue;
      // 이미 스킴이 붙었거나 //로 시작하는 절대 주소는 그대로 둔다
      if (/^[a-z][a-z0-9+.-]*:/i.test(src) || src.startsWith("//")) continue;
      // markdown-it이 이미 퍼센트 인코딩해 둔 값이므로 다시 인코딩하면 "%"가 "%25"가 된다
      const host = src.startsWith("/") ? "folder" : "note";
      img.setAttribute("src", "mermark-local://" + host + "/" + src.replace(/^\/+/, ""));
    }
  }

  // CommonMark는 링크 주소에 공백을 허용하지 않아 "![그림](./내 사진.png)"이 이미지로 파싱되지
  // 않고 글자 그대로 남는다. 한글 파일명은 공백이 흔하므로 렌더 전에 주소의 공백만 %20으로 바꾼다.
  // 줄 안에서만 치환하므로 data-line 매핑(스크롤 동기화)은 그대로다.
  function encodePathSpaces(markdown) {
    let fence = null;
    return markdown.split("\n").map((line) => {
      const trimmed = line.trim();
      const runLength = (marker) => {
        let count = 0;
        while (trimmed[count] === marker) count += 1;
        return count;
      };

      if (fence) {
        const run = runLength(fence.marker);
        if (run >= fence.length && trimmed.slice(run) === "") fence = null;
        return line;
      }
      const first = trimmed[0];
      if (first === "`" || first === "~") {
        const run = runLength(first);
        if (run >= 3) {
          fence = { marker: first, length: run };
          return line;
        }
      }
      return encodePathSpacesInLine(line);
    }).join("\n");
  }

  function encodePathSpacesInLine(line) {
    const codeSpans = [];
    const codePattern = /`[^`\n]+`/g;
    let found;
    while ((found = codePattern.exec(line)) !== null) {
      codeSpans.push([found.index, found.index + found[0].length]);
    }
    const insideCode = (index) => codeSpans.some(([start, end]) => index >= start && index < end);

    return line.replace(/(!?\[[^\]\n]*\]\()([^)\n]*)(\))/g, (whole, head, destination, tail, offset) => {
      if (insideCode(offset)) return whole;
      if (destination.startsWith("<")) return whole;   // 이미 꺾쇠로 감싼 경우

      // 제목이 붙어 있으면 주소 부분만 바꾼다: [글](주소 "제목")
      const titleMatch = destination.match(/\s+["'][^"']*["']$/);
      const title = titleMatch ? titleMatch[0] : "";
      const url = title ? destination.slice(0, destination.length - title.length) : destination;
      if (!url.includes(" ")) return whole;

      return head + url.split(" ").join("%20") + title + tail;
    });
  }

  // markdown-it은 GFM 할 일 목록을 모르기 때문에 "[x] 내용"이 글자 그대로 남는다.
  // 렌더 후 앞의 대괄호를 실제 체크박스로 바꾸고, 누르면 원본 줄을 고치도록 연결한다.
  function renderTaskLists() {
    for (const item of document.querySelectorAll("#content li")) {
      const first = item.firstElementChild;
      const host = first && first.tagName === "P" ? first : item;
      const node = host.firstChild;
      if (!node || node.nodeType !== Node.TEXT_NODE) continue;

      const match = node.textContent.match(/^\[([ xX])\]\s+/);
      if (!match) continue;

      const checked = match[1].toLowerCase() === "x";
      node.textContent = node.textContent.slice(match[0].length);

      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = checked;
      const line = item.dataset.taskLine;
      if (line === undefined) {
        box.disabled = true;
      } else {
        box.addEventListener("change", () => {
          window.webkit?.messageHandlers?.toggleTask?.postMessage(Number(line));
        });
      }

      host.insertBefore(box, node);
      item.classList.add("task-item");
      if (checked) item.classList.add("done");
    }
  }

  // 본문의 #태그를 알약 모양으로 바꿔 한눈에 보이게 한다.
  // 코드·링크 안은 건드리지 않고, 규칙은 MarkdownTags.swift와 같게 맞춘다.
  const TAG_PATTERN = /(^|\s)#([\p{L}\p{N}_][\p{L}\p{N}_/-]*)/gu;

  function renderTags() {
    const content = document.getElementById("content");
    const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        for (let el = node.parentElement; el && el !== content; el = el.parentElement) {
          const name = el.tagName;
          if (name === "CODE" || name === "PRE" || name === "A" || el.classList.contains("tag")) {
            return NodeFilter.FILTER_REJECT;
          }
        }
        TAG_PATTERN.lastIndex = 0;
        return TAG_PATTERN.test(node.textContent) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      },
    });

    // 순회 중 DOM을 바꾸면 walker가 어긋나므로 먼저 모아 둔다
    const targets = [];
    while (walker.nextNode()) targets.push(walker.currentNode);
    for (const node of targets) wrapTagsInTextNode(node);
  }

  function wrapTagsInTextNode(node) {
    const text = node.textContent;
    const fragment = document.createDocumentFragment();
    let cursor = 0;
    let match;

    TAG_PATTERN.lastIndex = 0;
    while ((match = TAG_PATTERN.exec(text)) !== null) {
      const start = match.index + match[1].length;   // "#"이 시작하는 위치
      if (start > cursor) fragment.appendChild(document.createTextNode(text.slice(cursor, start)));

      const pill = document.createElement("span");
      pill.className = "tag";
      pill.textContent = "#" + match[2];
      pill.dataset.tag = match[2];
      pill.title = "이 태그로 거르기";
      fragment.appendChild(pill);
      cursor = TAG_PATTERN.lastIndex;
    }
    if (!fragment.childNodes.length) return;

    if (cursor < text.length) fragment.appendChild(document.createTextNode(text.slice(cursor)));
    node.parentNode.replaceChild(fragment, node);
  }

  // 태그를 누르면 사이드바 필터가 그 태그로 바뀐다
  document.getElementById("content").addEventListener("click", (event) => {
    const pill = event.target.closest?.(".tag");
    if (!pill) return;
    window.webkit?.messageHandlers?.selectTag?.postMessage(pill.dataset.tag);
  });

  // 상대경로 링크도 같은 스킴으로 바꾼다. Swift가 가로채 앱 안에서 노트를 연다.
  function resolveLocalLinks() {
    for (const anchor of document.querySelectorAll("#content a")) {
      const href = anchor.getAttribute("href");
      if (!href || href.startsWith("#")) continue;
      if (/^[a-z][a-z0-9+.-]*:/i.test(href) || href.startsWith("//")) continue;
      const host = href.startsWith("/") ? "folder" : "note";
      anchor.setAttribute("href", "mermark-local://" + host + "/" + href.replace(/^\/+/, ""));
    }
  }

  window.renderMarkdown = async (markdown) => {
    document.getElementById("content").innerHTML = md.render(encodePathSpaces(markdown));
    resolveLocalImages();
    resolveLocalLinks();
    renderTaskLists();
    renderTags();
    lastReportedLine = -1;
    try {
      await mermaid.run({ nodes: document.querySelectorAll("pre.mermaid") });
    } catch (e) {
      // 문법 오류 시 mermaid가 해당 블록에 에러를 표시하므로 그대로 둔다
    }
  };

  // ── 에디터 ↔ 프리뷰 스크롤 동기화 ──────────────────────────────
  let suppressScrollReport = false;
  let suppressTimer = null;
  let lastReportedLine = -1;

  const anchors = () => [...document.querySelectorAll("[data-line]")];
  const lineOf = (el) => +el.dataset.line;

  /// value 이하인 마지막 앵커와 그 다음 앵커를 찾는다. 둘 사이는 비례 보간해서 쓴다.
  function bracket(list, valueOf, value) {
    let base = list[0];
    let next = null;
    for (const el of list) {
      if (valueOf(el) <= value) {
        base = el;
        next = null;
      } else {
        next = el;
        break;
      }
    }
    const span = next ? valueOf(next) - valueOf(base) : 0;
    const ratio = span > 0 ? Math.min(1, Math.max(0, (value - valueOf(base)) / span)) : 0;
    return { base, next: next || base, ratio };
  }

  window.scrollPreviewToLine = (line) => {
    const list = anchors();
    if (!list.length) return;
    const { base, next, ratio } = bracket(list, lineOf, line);
    suppressScrollReport = true;
    clearTimeout(suppressTimer);
    suppressTimer = setTimeout(() => { suppressScrollReport = false; }, 250);
    window.scrollTo(0, base.offsetTop + (next.offsetTop - base.offsetTop) * ratio);
  };

  /// 다른 노트를 "#섹션" 링크로 열었을 때 해당 헤딩으로 이동한다
  window.scrollPreviewToAnchor = (anchor) => {
    const target = document.getElementById(anchor);
    if (!target) return false;
    suppressScrollReport = true;
    clearTimeout(suppressTimer);
    suppressTimer = setTimeout(() => { suppressScrollReport = false; }, 250);
    window.scrollTo(0, target.offsetTop);
    return true;
  };

  window.currentPreviewLine = () => {
    const list = anchors();
    if (!list.length) return 0;
    const { base, next, ratio } = bracket(list, (el) => el.offsetTop, window.scrollY);
    return Math.round(lineOf(base) + (lineOf(next) - lineOf(base)) * ratio);
  };

  window.addEventListener("scroll", () => {
    if (suppressScrollReport) return;
    const line = window.currentPreviewLine();
    if (line === lastReportedLine) return;
    lastReportedLine = line;
    window.webkit?.messageHandlers?.previewScroll?.postMessage(line);
  });
</script>
</body>
</html>
